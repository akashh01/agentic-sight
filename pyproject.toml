[project]
name = "agentic-sight"
version = "0.3.0"
description = "Agentic Sight — LangGraph-based video safety detector (query optimizer agent + detection agent)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2",
    "opencv-python>=4.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "arize-phoenix>=4.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
]

[project.scripts]
agentic-sight = "agentic_sight.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_sight"]
